<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelojLaboral Pro - Control Horario con QR</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .inp { width:100%; padding:.65rem .9rem; background:rgba(15,23,42,.6); border:1px solid #334155; border-radius:.75rem; color:#fff; outline:none; }
  .inp:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.25); }
  .lbl { display:block; font-size:.7rem; font-weight:600; color:#cbd5e1; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.35rem; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.45rem; padding:.55rem 1rem; border-radius:.7rem; font-weight:600; font-size:.85rem; transition:all .15s; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-pri { background:#4f46e5; color:#fff; } .btn-pri:hover:not(:disabled) { background:#6366f1; }
  .btn-sec { background:#334155; color:#e2e8f0; } .btn-sec:hover:not(:disabled) { background:#475569; }
  .btn-dan { background:rgba(239,68,68,.15); color:#fca5a5; } .btn-dan:hover:not(:disabled) { background:rgba(239,68,68,.3); }
  .btn-sm { padding:.35rem .65rem; font-size:.75rem; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:1rem; }
  .tbl { width:100%; font-size:.85rem; }
  .tbl th { text-align:left; font-size:.7rem; text-transform:uppercase; color:#94a3b8; font-weight:600; padding:.6rem .75rem; border-bottom:1px solid #334155; white-space:nowrap; }
  .tbl td { padding:.6rem .75rem; border-bottom:1px solid rgba(51,65,85,.5); }
  .tbl tr:hover td { background:rgba(51,65,85,.25); }
  .nav-item { display:flex; align-items:center; gap:.7rem; width:100%; padding:.6rem .8rem; border-radius:.7rem; font-size:.875rem; color:#cbd5e1; }
  .nav-item:hover { background:#334155; } .nav-item.act { background:rgba(99,102,241,.2); color:#fff; }
  .badge { display:inline-block; padding:.15rem .55rem; border-radius:999px; font-size:.7rem; font-weight:600; }
  .qrbox canvas, .qrbox img { background:#fff; padding:8px; border-radius:.6rem; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
<div id="app" class="flex-grow flex flex-col"></div>
<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-40"></div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden"></div>

<script>
// ================== CONFIGURACIÓN ==================
// La clave "anon" es pública por diseño: la seguridad la dan las reglas (RLS) de la base.
const SUPABASE_URL = "https://olskkrvkwiqiakwlgfes.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sc2trcnZrd2lxaWFrd2xnZmVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNDAxMDksImV4cCI6MjEwODcxNjEwOX0.7fJSTM0fTRHLeoKMh6fSgxHEF0_6c-iaZzJtMiwvaig";
const ZONA = "America/Argentina/Buenos_Aires";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: true, storageKey: "reloj_laboral_sesion" } });
const qrParam = new URLSearchParams(location.search).get("qr");

const S = { user: null, perfil: null, empresaId: null, empresa: null, tab: "panel", superTab: "empresas", baseUrl: "", cache: {} };

// ================== UTILIDADES ==================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fFecha = ts => ts ? new Date(ts).toLocaleDateString("es-AR", { timeZone: ZONA, day:"2-digit", month:"2-digit", year:"numeric" }) : "—";
const fHora = ts => ts ? new Date(ts).toLocaleTimeString("es-AR", { timeZone: ZONA, hour:"2-digit", minute:"2-digit", hour12:false }) : "—";
const fMinCorto = m => m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m} min`;
const fMin = m => { m = Math.max(0, Math.round(m || 0)); return Math.floor(m/60) + "h " + String(m%60).padStart(2,"0") + "m"; };
const DIAS = [[1, "L", "Lunes"], [2, "M", "Martes"], [3, "X", "Miércoles"], [4, "J", "Jueves"], [5, "V", "Viernes"], [6, "S", "Sábado"], [7, "D", "Domingo"]];
const hm = t => t ? String(t).slice(0, 5) : "—";
function fDias(d) {
  const a = [...(d || [])].map(Number).sort();
  const k = a.join(",");
  if (!a.length) return "Sin días";
  if (k === "1,2,3,4,5") return "L a V";
  if (k === "1,2,3,4,5,6") return "L a S";
  if (k === "1,2,3,4,5,6,7") return "Todos los días";
  return a.map(n => DIAS[n - 1][1]).join(" ");
}
const fHorario = c => `${hm(c.hora_entrada)}–${hm(c.hora_salida)}${c.hora_salida && c.hora_entrada && c.hora_salida <= c.hora_entrada ? " (noche)" : ""}`;
const dowHoy = () => { const d = new Date(new Date().toLocaleString("en-US", { timeZone: ZONA })).getDay(); return d === 0 ? 7 : d; };
const minutosAhora = () => { const [h, m] = new Date().toLocaleTimeString("en-GB", { timeZone: ZONA, hour: "2-digit", minute: "2-digit", hour12: false }).split(":").map(Number); return h * 60 + m; };
// ---- Ubicación: editor reutilizable (oficinas y lugar remoto) ----
function parseCoords(t) {
  t = String(t || "");
  let m = t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null;
}
function ubiEditorHTML(p, u) {
  return `
    <div class="space-y-2">
      <div class="flex gap-2"><input id="${p}Buscar" class="inp" placeholder="Buscar dirección (calle, número, ciudad)" onkeydown="if(event.key==='Enter'){event.preventDefault();ubiBuscar('${p}')}">
        <button type="button" class="btn btn-sec shrink-0" onclick="ubiBuscar('${p}')"><i class="fa-solid fa-magnifying-glass"></i></button></div>
      <div id="${p}Res" class="space-y-1"></div>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="btn btn-sm btn-sec" onclick="ubiActual('${p}')"><i class="fa-solid fa-location-crosshairs"></i>Usar mi ubicación actual</button>
        <input id="${p}Pegar" class="inp !w-auto flex-grow text-xs" placeholder="…o pegá coordenadas / link de Google Maps" oninput="ubiPegar('${p}')">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div><label class="lbl">Latitud</label><input id="${p}Lat" class="inp font-mono text-xs" value="${u.lat ?? ""}" oninput="ubiMapa('${p}')"></div>
        <div><label class="lbl">Longitud</label><input id="${p}Lng" class="inp font-mono text-xs" value="${u.lng ?? ""}" oninput="ubiMapa('${p}')"></div>
        <div><label class="lbl">Radio (m)</label><input id="${p}Radio" type="number" min="20" max="5000" class="inp" value="${u.radio ?? 150}" oninput="ubiMapa('${p}')"></div>
      </div>
      <p id="${p}Info" class="text-xs text-slate-400"></p>
      <div id="${p}Mapa" class="rounded-xl overflow-hidden border border-slate-700 bg-slate-900 h-48 flex items-center justify-center text-xs text-slate-500">Sin ubicación cargada</div>
    </div>`;
}
function ubiLeer(p) {
  const lat = parseFloat(String($(p + "Lat").value).replace(",", ".")), lng = parseFloat(String($(p + "Lng").value).replace(",", "."));
  return { lat: isFinite(lat) ? lat : null, lng: isFinite(lng) ? lng : null, radio: Math.round(+$(p + "Radio").value || 0) };
}
function ubiMapa(p) {
  const u = ubiLeer(p), box = $(p + "Mapa");
  if (!box) return;
  if (u.lat == null || u.lng == null || Math.abs(u.lat) > 90 || Math.abs(u.lng) > 180) { box.innerHTML = "Sin ubicación cargada"; return; }
  const d = Math.max(0.002, (u.radio || 150) / 111000 * 2.2);
  const src = `https://www.openstreetmap.org/export/embed.html?bbox=${u.lng - d},${u.lat - d},${u.lng + d},${u.lat + d}&layer=mapnik&marker=${u.lat},${u.lng}`;
  box.innerHTML = `<iframe title="Mapa" class="w-full h-full" loading="lazy" src="${src}"></iframe>`;
}
function ubiSet(p, lat, lng, info) {
  $(p + "Lat").value = (+lat).toFixed(6); $(p + "Lng").value = (+lng).toFixed(6);
  $(p + "Info").textContent = info || ""; ubiMapa(p);
}
function ubiPegar(p) { const c = parseCoords($(p + "Pegar").value); if (c) ubiSet(p, c.lat, c.lng, "Coordenadas cargadas."); }
function ubiActual(p) {
  if (!navigator.geolocation) return toast("Este dispositivo no permite obtener la ubicación", "error");
  $(p + "Info").textContent = "Obteniendo ubicación…";
  navigator.geolocation.getCurrentPosition(
    pos => ubiSet(p, pos.coords.latitude, pos.coords.longitude, `Ubicación actual (precisión ±${Math.round(pos.coords.accuracy)} m).${pos.coords.accuracy > 100 ? " Es poco precisa: si podés, cargala desde el celular con GPS." : ""}`),
    () => { $(p + "Info").textContent = "No se pudo obtener la ubicación. Revisá el permiso de ubicación del navegador."; },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}
async function ubiBuscar(p) {
  const q = $(p + "Buscar").value.trim();
  if (q.length < 4) return;
  $(p + "Res").innerHTML = `<p class="text-xs text-slate-400">Buscando…</p>`;
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=ar,uy&q=" + encodeURIComponent(q), { headers: { "Accept-Language": "es" } });
    const lista = await r.json();
    S.cache.ubiRes = lista;
    $(p + "Res").innerHTML = lista.length ? lista.map((x, i) => `<button type="button" class="block w-full text-left text-xs px-3 py-2 rounded-lg bg-slate-900/60 hover:bg-slate-700" onclick="ubiElegir('${p}', ${i})">${esc(x.display_name)}</button>`).join("")
      : `<p class="text-xs text-slate-400">No se encontró. Probá con calle, número y ciudad, o pegá las coordenadas de Google Maps.</p>`;
  } catch { $(p + "Res").innerHTML = `<p class="text-xs text-red-400">No se pudo buscar ahora. Pegá las coordenadas de Google Maps.</p>`; }
}
function ubiElegir(p, i) { const x = S.cache.ubiRes[i]; $(p + "Res").innerHTML = ""; ubiSet(p, x.lat, x.lon, "Ubicación de la dirección elegida. Revisá en el mapa que el punto esté bien."); }
const badgeGeo = o => o.geo_activa && o.lat != null
  ? `<span class="badge bg-emerald-500/15 text-emerald-300">📍 Geocerca ${o.radio_m} m</span>`
  : `<span class="badge bg-slate-600/40 text-slate-300">📍 Sin geocerca</span>`;
function abrirUbicacion(ofiId) {
  const o = (S.cache.oficinas || []).find(x => x.id === ofiId);
  abrirModal(`
    <h3 class="text-lg font-bold mb-1">Ubicación de ${esc(o.nombre)}</h3>
    <p class="text-sm text-slate-400 mb-4">Con la geocerca activa, solo se puede fichar estando dentro del radio (o en el lugar remoto del colaborador, si lo tiene).</p>
    ${ubiEditorHTML("uo", { lat: o.lat, lng: o.lng, radio: o.radio_m })}
    <label class="flex items-center gap-2 mt-4 text-sm"><input type="checkbox" id="uoActiva" class="w-4 h-4" ${o.geo_activa ? "checked" : ""}> Exigir estar en el lugar para fichar (geocerca activa)</label>
    <p id="uoErr" class="text-red-400 text-sm min-h-[1.25rem] mt-2"></p>
    <div class="flex justify-end gap-2"><button class="btn btn-sec" onclick="cerrarModal()">Cancelar</button><button class="btn btn-pri" onclick="guardarUbicacion('${ofiId}')">Guardar</button></div>`);
  if (!$("uoBuscar").value && o.direccion) $("uoBuscar").value = o.direccion;
  ubiMapa("uo");
}
async function guardarUbicacion(ofiId) {
  const u = ubiLeer("uo"), activa = $("uoActiva").checked;
  if ((u.lat == null) !== (u.lng == null)) return $("uoErr").textContent = "Completá latitud y longitud.";
  if (activa && u.lat == null) return $("uoErr").textContent = "Para activar la geocerca cargá la ubicación.";
  if (u.radio < 20 || u.radio > 5000) return $("uoErr").textContent = "El radio tiene que ser entre 20 y 5000 m.";
  try {
    await rpc("rl_guardar_ubicacion", { p_oficina: ofiId, p_lat: u.lat, p_lng: u.lng, p_radio: u.radio, p_activa: activa });
    cerrarModal(); toast("Ubicación guardada");
    if (S.perfil.rol === "superadmin" && !S.empresaId) renderSuperEmpresas(); else tabOficinas();
  } catch (e) { $("uoErr").textContent = errTxt(e); }
}
const hoyISO = () => new Date().toLocaleDateString("en-CA", { timeZone: ZONA });
const sumarDias = (iso, d) => { const x = new Date(iso + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + d); return x.toISOString().slice(0,10); };
const linkQR = tok => {
  let b = (S.baseUrl || (location.origin + location.pathname)).split(/[?#]/)[0];
  if (!/\/$/.test(b) && !/\.html?$/i.test(b)) b += "/";
  return b + "?qr=" + encodeURIComponent(tok);
};

function toast(msg, tipo = "ok") {
  const t = $("toast");
  t.innerHTML = `<div class="px-4 py-3 rounded-xl shadow-2xl text-sm font-medium ${tipo === "error" ? "bg-red-600" : "bg-emerald-600"}">${esc(msg)}</div>`;
  t.classList.remove("hidden"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add("hidden"), 3500);
}
function abrirModal(html, { fijo = false } = {}) {
  const m = $("modal");
  m.innerHTML = `<div class="card w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 shadow-2xl relative">
    ${fijo ? "" : `<button onclick="cerrarModal()" class="absolute top-3 right-4 text-slate-400 hover:text-white text-xl" aria-label="Cerrar">✕</button>`}${html}</div>`;
  m.dataset.fijo = fijo ? "1" : ""; m.classList.remove("hidden"); m.classList.add("flex");
  setTimeout(() => m.querySelector("input,select")?.focus(), 30);
}
function cerrarModal(forzar) { const m = $("modal"); if (m.dataset.fijo && !forzar) return; m.classList.add("hidden"); m.classList.remove("flex"); m.innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });
$("modal").addEventListener("click", e => { if (e.target.id === "modal") cerrarModal(); });

function errTxt(e) {
  const m = e?.message || String(e);
  if (/duplicate key.*dni/i.test(m) || /colaboradores_empresa_id_dni_key/.test(m)) return "Ya existe un colaborador con ese DNI.";
  if (/violates foreign key.*registros/i.test(m)) return "Tiene fichajes registrados: desactivalo en lugar de borrarlo.";
  if (/Invalid login credentials/i.test(m)) return "Email o contraseña incorrectos.";
  if (/check constraint.*dni/i.test(m)) return "El DNI debe tener entre 6 y 9 números.";
  return m;
}
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
async function adminFn(body) {
  const { data, error } = await sb.functions.invoke("rl-admin", { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
function pintarQRs(root = document) {
  root.querySelectorAll("[data-qr]").forEach(el => {
    if (el.dataset.hecho) return; el.dataset.hecho = "1";
    new QRCode(el, { text: el.dataset.qr, width: +el.dataset.size || 140, height: +el.dataset.size || 140, correctLevel: QRCode.CorrectLevel.M });
  });
}
function cargando(txt = "Cargando…") { return `<div class="flex-grow flex items-center justify-center text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>${txt}</div>`; }

// ================== ARRANQUE ==================
async function init() {
  if (qrParam) return renderFichaje();
  $("app").innerHTML = cargando();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  await cargarSesion(session.user);
}
async function cargarSesion(user) {
  S.user = user;
  const { data: perfil, error } = await sb.from("perfiles").select("*").eq("user_id", user.id).maybeSingle();
  if (error || !perfil) { await sb.auth.signOut(); return renderLogin("Tu usuario no tiene acceso a la plataforma."); }
  S.perfil = perfil;
  const { data: cfg } = await sb.from("config").select("valor").eq("clave", "base_url").maybeSingle();
  S.baseUrl = cfg?.valor || "";
  if (perfil.rol === "empresa") {
    const { data: emp } = await sb.from("empresas").select("*").eq("id", perfil.empresa_id).maybeSingle();
    if (!emp) { await sb.auth.signOut(); return renderLogin("La cuenta de tu empresa está desactivada. Contactá al proveedor."); }
    S.empresaId = emp.id; S.empresa = emp; S.tab = "panel";
  }
  route();
  if (perfil.clave_temporal) abrirCambioClave(true);
}
function route() {
  if (S.perfil.rol === "superadmin" && !S.empresaId) return renderSuper();
  renderEmpresa();
}
async function logout() { await sb.auth.signOut(); Object.assign(S, { user:null, perfil:null, empresaId:null, empresa:null }); cerrarModal(true); renderLogin(); }

// ================== LOGIN ==================
function renderLogin(aviso = "") {
  $("app").innerHTML = `
  <div class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950">
    <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-indigo-600/20 text-indigo-300 flex items-center justify-center text-2xl"><i class="fa-solid fa-clock"></i></div>
        <h1 class="text-2xl font-bold tracking-tight text-white">RelojLaboral Pro</h1>
        <p class="text-slate-400 text-sm mt-1">Plataforma SaaS de Control Horario con QR</p>
      </div>
      ${aviso ? `<div class="mb-4 p-3 rounded-xl bg-amber-500/15 text-amber-200 text-sm">${esc(aviso)}</div>` : ""}
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div><label class="lbl" for="loginUser">Email</label><input type="email" id="loginUser" required autocomplete="username" class="inp"></div>
        <div><label class="lbl" for="loginPass">Contraseña</label><input type="password" id="loginPass" required autocomplete="current-password" class="inp"></div>
        <p id="loginError" class="text-red-400 text-sm min-h-[1.25rem]"></p>
        <button type="submit" id="btnLogin" class="btn btn-pri w-full py-3">Iniciar sesión</button>
      </form>
    </div>
  </div>`;
}
async function handleLogin(e) {
  e.preventDefault();
  const b = $("btnLogin"); b.disabled = true; $("loginError").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("loginUser").value.trim(), password: $("loginPass").value });
  b.disabled = false;
  if (error) { $("loginError").textContent = errTxt(error); return; }
  $("app").innerHTML = cargando();
  await cargarSesion(data.user);
}

// ================== CAMBIO DE CLAVE ==================
function abrirCambioClave(obligatorio) {
  abrirModal(`
    <h3 class="text-lg font-bold mb-1">${obligatorio ? "Elegí tu contraseña" : "Cambiar mi contraseña"}</h3>
    <p class="text-sm text-slate-400 mb-4">${obligatorio ? "Estás usando una contraseña temporal. Cambiala para continuar." : "Mínimo 8 caracteres, con letras y números."}</p>
    <div class="space-y-3">
      <div><label class="lbl">Contraseña actual</label><input type="password" id="clvAct" class="inp" autocomplete="current-password"></div>
      <div><label class="lbl">Nueva contraseña</label><input type="password" id="clvNue" class="inp" autocomplete="new-password"></div>
      <div><label class="lbl">Repetir nueva</label><input type="password" id="clvRep" class="inp" autocomplete="new-password"></div>
      <p id="clvErr" class="text-red-400 text-sm min-h-[1.25rem]"></p>
      <div class="flex gap-2 justify-end">
        ${obligatorio ? `<button class="btn btn-sec" onclick="logout()">Cerrar sesión</button>` : `<button class="btn btn-sec" onclick="cerrarModal()">Cancelar</button>`}
        <button class="btn btn-pri" id="btnClv" onclick="guardarClave()">Guardar</button>
      </div>
    </div>`, { fijo: obligatorio });
}
async function guardarClave() {
  const a = $("clvAct").value, n = $("clvNue").value, r = $("clvRep").value, err = $("clvErr");
  err.textContent = "";
  if (n.length < 8) return err.textContent = "La nueva contraseña debe tener al menos 8 caracteres.";
  if (!/[a-zA-Z]/.test(n) || !/\d/.test(n)) return err.textContent = "Tiene que tener letras y números.";
  if (n !== r) return err.textContent = "Las contraseñas nuevas no coinciden.";
  if (n === a) return err.textContent = "La nueva tiene que ser distinta de la actual.";
  const b = $("btnClv"); b.disabled = true;
  const chk = await sb.auth.signInWithPassword({ email: S.user.email, password: a });
  if (chk.error) { b.disabled = false; return err.textContent = "La contraseña actual no es correcta."; }
  const { error } = await sb.auth.updateUser({ password: n });
  if (error) { b.disabled = false; return err.textContent = errTxt(error); }

function imprimirQR(id) {
  const o = (S.cache.oficinas || []).find(x => x.id === id);
  const emp = S.empresa || (S.cache.empresas || []).find(e => e.id === o.empresa_id);
  const tmp = document.createElement("div"); tmp.style.display = "none"; document.body.appendChild(tmp);
  new QRCode(tmp, { text: linkQR(o.qr_token), width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
  setTimeout(() => {
    const src = (tmp.querySelector("canvas")?.toDataURL()) || tmp.querySelector("img")?.src;
    tmp.remove();
    const w = window.open("", "_blank");
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>QR ${esc(o.nombre)}</title>
      <style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;color:#111}img{width:320px;height:320px}h1{margin:.2em 0}p{color:#444}</style></head>

      <p style="font-size:11px;color:#888">${esc(o.qr_token)}</p><script>setTimeout(()=>print(),300)<\/script></body></html>`);
    w.document.close();
  }, 100);
}

        sb.from("registros").select("id, entrada, salida, tardanza_min, salida_anticipada_min, dia_laborable, hora_entrada_prog, hora_salida_prog, entrada_lugar, salida_lugar, colaborador_id, colaboradores(nombre, cargo), oficina:oficinas!registros_oficina_id_fkey(nombre)")
          .eq("empresa_id", S.empresaId).gte("entrada", hoyISO() + "T00:00:00-03:00").order("entrada", { ascending: false }),
        sb.from("colaboradores").select("id, nombre, cargo, hora_entrada, hora_salida, dias").eq("empresa_id", S.empresaId).eq("estado", "Activa").order("hora_entrada"),
      ]);
      const dow = dowHoy(), ahora = minutosAhora(), tol = S.empresa.tolerancia_min || 0;
      const ficharon = new Set((hoy || []).map(x => x.colaborador_id));

      $("empMain").innerHTML = `
        <div class="flex flex-wrap justify-between items-end gap-2 mb-5">
          <div><h3 class="text-xl font-bold">Panel general</h3><p class="text-xs text-slate-400">Hoy, ${fFecha(new Date())} · se actualiza cada minuto</p></div>
          <button class="btn btn-sm btn-sec" onclick="tabPanel()"><i class="fa-solid fa-rotate"></i>Actualizar</button>
        </div>
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
          ${stat("Presentes ahora", `${r.presentes} <span class="text-sm text-slate-400 font-normal">de ${r.programados} que trabajan hoy</span>`, "fa-user-check", "emerald")}
          ${stat("Horas trabajadas hoy", fMin(r.minutos), "fa-hourglass-half", "indigo")}
          ${stat("Tardanzas", r.tardanzas, "fa-triangle-exclamation", "amber")}
          ${stat("Salidas anticipadas", r.anticipadas, "fa-person-walking-arrow-right", "orange")}
          ${stat("Sin fichar hoy", r.ausentes, "fa-user-xmark", "red")}
        </div>
        ${faltan.length ? `<div class="card overflow-x-auto mb-6">
          <div class="px-4 py-3 border-b border-slate-700 font-semibold text-sm">Trabajan hoy y todavía no ficharon</div>
          <table class="tbl"><thead><tr><th>Colaborador</th><th>Horario</th><th>Situación</th></tr></thead><tbody>
          ${faltan.map(c => { const atrasado = ahora > minDe(c.hora_entrada) + tol;
            return `<tr><td><p class="font-medium">${esc(c.nombre)}</p><p class="text-xs text-slate-400">${esc(c.cargo)}</p></td><td>${fHorario(c)}</td>
            <td>${atrasado ? `<span class="badge bg-red-500/15 text-red-300">Atrasado (entra ${hm(c.hora_entrada)})</span>` : `<span class="badge bg-slate-600/40 text-slate-300">Entra a las ${hm(c.hora_entrada)}</span>`}</td></tr>`; }).join("")}
          </tbody></table></div>` : ""}
        <div class="card overflow-x-auto">
          <div class="px-4 py-3 border-b border-slate-700 font-semibold text-sm">Fichajes de hoy</div>
          ${hoy?.length ? `<table class="tbl"><thead><tr><th>Colaborador</th><th>Horario</th><th>Oficina</th><th>Entrada</th><th>Salida</th><th>Tiempo</th><th>Estado</th></tr></thead><tbody>
            ${hoy.map(x => `<tr><td><p class="font-medium">${esc(x.colaboradores?.nombre)}</p><p class="text-xs text-slate-400">${esc(x.colaboradores?.cargo)}</p></td>
              <td class="whitespace-nowrap">${x.hora_entrada_prog ? fHorario({ hora_entrada: x.hora_entrada_prog, hora_salida: x.hora_salida_prog }) : "—"}</td>
              <td>${esc(x.oficina?.nombre || "—")}</td><td>${fHora(x.entrada)}</td><td>${fHora(x.salida)}</td>
              <td>${fMin((new Date(x.salida || Date.now()) - new Date(x.entrada)) / 60000)}</td><td>${estadoBadge(x)}</td></tr>`).join("")}
          </tbody></table>` : `<p class="p-4 text-sm text-slate-400">Nadie fichó todavía hoy.</p>`}
        </div>`;

  };

  clearInterval(S._refresco); S._refresco = setInterval(cargar, 60000);
}
function estadoBadge(x) {
  let t = x.tardanza_min > 0 ? `<span class="badge bg-amber-500/15 text-amber-300">Tarde ${fMinCorto(x.tardanza_min)}</span> ` : "";
  if (x.salida_anticipada_min > 0) t += `<span class="badge bg-orange-500/15 text-orange-300">Se fue ${fMinCorto(x.salida_anticipada_min)} antes</span> `;
  if (x.dia_laborable === false) t += `<span class="badge bg-sky-500/15 text-sky-300">Día no laborable</span> `;
  if (x.entrada_lugar === "remoto" || x.salida_lugar === "remoto") t += `<span class="badge bg-violet-500/15 text-violet-300">🏠 Remoto</span> `;
  if (!x.salida) {
    const viejo = Date.now() - new Date(x.entrada) > 16 * 3600e3;
    return t + (viejo ? `<span class="badge bg-red-500/15 text-red-300">Sin salida</span>` : `<span class="badge bg-emerald-500/15 text-emerald-300">Trabajando</span>`);
  }
  return t + `<span class="badge bg-slate-600/40 text-slate-300">Completo</span>`;
}

async function desvincularCelular(id) {
  if (!confirm("¿Desvincular el celular? El próximo fichaje que haga desde cualquier celular lo va a vincular de nuevo.")) return;
  const { error } = await sb.from("colaboradores").update({ dispositivo_hash: null, dispositivo_at: null }).eq("id", id);
  if (error) return toast(errTxt(error), "error");
  cerrarModal(); toast("Celular desvinculado"); tabColaboradores();
}
function marcarDias(lista, cont = "cDias") { document.querySelectorAll(`#${cont} input`).forEach(i => i.checked = lista.includes(+i.value)); }
async function guardarColaborador(id) {
  const fila = { nombre: $("cNom").value.trim(), dni: $("cDni").value.replace(/\D/g, ""), cargo: $("cCar").value.trim(), estado: $("cEst").value,
    hora_entrada: $("cHE").value, hora_salida: $("cHS").value, dias: [...document.querySelectorAll("#cDias input:checked")].map(i => +i.value) };
  if (!fila.nombre) return $("cErr").textContent = "Falta el nombre.";
  if (!/^\d{6,9}$/.test(fila.dni)) return $("cErr").textContent = "El DNI debe tener entre 6 y 9 números.";
  if (!fila.hora_entrada || !fila.hora_salida) return $("cErr").textContent = "Completá la hora de entrada y la de salida.";
  if (fila.hora_entrada === fila.hora_salida) return $("cErr").textContent = "La entrada y la salida no pueden ser a la misma hora.";
  if (!fila.dias.length) return $("cErr").textContent = "Marcá al menos un día de trabajo.";
  const ur = ubiLeer("cr");
  Object.assign(fila, { remoto_activo: $("cRem").checked, remoto_direccion: $("cRemDir").value.trim(), remoto_lat: ur.lat, remoto_lng: ur.lng,
    remoto_radio_m: ur.radio || 150, remoto_dias: [...document.querySelectorAll("#cRemDias input:checked")].map(i => +i.value) });
  if (fila.remoto_activo) {
    if (fila.remoto_lat == null || fila.remoto_lng == null) return $("cErr").textContent = "Cargá la ubicación del lugar remoto (buscá la dirección o pegá las coordenadas).";
    if (!fila.remoto_dias.length) return $("cErr").textContent = "Marcá al menos un día para el trabajo remoto.";
    if (fila.remoto_radio_m < 20 || fila.remoto_radio_m > 5000) return $("cErr").textContent = "El radio del lugar remoto tiene que ser entre 20 y 5000 m.";
  }
  const { error } = id ? await sb.from("colaboradores").update(fila).eq("id", id) : await sb.from("colaboradores").insert({ ...fila, empresa_id: S.empresaId });
  if (error) return $("cErr").textContent = errTxt(error);
  cerrarModal(); toast("Colaborador guardado"); tabColaboradores();
}
async function toggleColaborador(id) {
  const c = S.cache.colaboradores.find(x => x.id === id);
  const { error } = await sb.from("colaboradores").update({ estado: c.estado === "Activa" ? "Inactiva" : "Activa" }).eq("id", id);
  if (error) return toast(errTxt(error), "error");
  tabColaboradores();
}
async function borrarColaborador(id) {
  if (!confirm("¿Eliminar el colaborador? Si ya fichó alguna vez, conviene desactivarlo para conservar su historial.")) return;
  const { error } = await sb.from("colaboradores").delete().eq("id", id);
  if (error) return toast(errTxt(error), "error");
  toast("Colaborador eliminado"); tabColaboradores();
}

// ---- Registros ----
async function tabRegistros() {
  if (!S.cache.colaboradores) { const { data } = await sb.from("colaboradores").select("*").eq("empresa_id", S.empresaId).order("nombre"); S.cache.colaboradores = data || []; }
  const f = S.filtroReg || (S.filtroReg = { desde: sumarDias(hoyISO(), -6), hasta: hoyISO(), col: "" });
  $("empMain").innerHTML = `
    <div class="flex flex-wrap gap-3 justify-between items-end mb-4">
      <h3 class="text-xl font-bold">Registros de fichaje</h3>
      <div class="flex flex-wrap gap-2 items-end">
        <div><label class="lbl">Desde</label><input type="date" id="rDesde" class="inp" value="${f.desde}"></div>
        <div><label class="lbl">Hasta</label><input type="date" id="rHasta" class="inp" value="${f.hasta}"></div>
        <div><label class="lbl">Colaborador</label><select id="rCol" class="inp"><option value="">Todos</option>${S.cache.colaboradores.map(c => `<option value="${c.id}" ${f.col === c.id ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}</select></div>
        <button class="btn btn-pri" onclick="buscarRegistros()"><i class="fa-solid fa-magnifying-glass"></i>Ver</button>
        <button class="btn btn-sec" onclick="exportarRegistros()"><i class="fa-solid fa-file-csv"></i>Exportar</button>
      </div>
    </div>
    <div id="regRes">${cargando()}</div>`;
  buscarRegistros();
}
async function buscarRegistros() {
  const f = S.filtroReg = { desde: $("rDesde").value, hasta: $("rHasta").value, col: $("rCol").value };
  if (!f.desde || !f.hasta || f.desde > f.hasta) return toast("Revisá las fechas", "error");
  let q = sb.from("registros").select("id, entrada, salida, tardanza_min, salida_anticipada_min, dia_laborable, hora_entrada_prog, hora_salida_prog, entrada_lugar, salida_lugar, entrada_distancia_m, salida_distancia_m, colaborador_id, colaboradores(nombre, dni), oficina:oficinas!registros_oficina_id_fkey(nombre), oficina_salida:oficinas!registros_oficina_salida_id_fkey(nombre)")
    .eq("empresa_id", S.empresaId).gte("entrada", f.desde + "T00:00:00-03:00").lt("entrada", sumarDias(f.hasta, 1) + "T00:00:00-03:00")
    .order("entrada", { ascending: false }).limit(2000);
  let qr = sb.from("fichaje_rechazos").select("id, creado, tipo, motivo, distancia_m, colaboradores(nombre), oficinas(nombre)")
    .eq("empresa_id", S.empresaId).gte("creado", f.desde + "T00:00:00-03:00").lt("creado", sumarDias(f.hasta, 1) + "T00:00:00-03:00")
    .order("creado", { ascending: false }).limit(200);
  if (f.col) { q = q.eq("colaborador_id", f.col); qr = qr.eq("colaborador_id", f.col); }
  const [{ data, error }, { data: rech }] = await Promise.all([q, qr]);
  if (!$("regRes")) return; // se cambió de pestaña mientras cargaba
  if (error) return $("regRes").innerHTML = `<p class="text-red-400">${esc(error.message)}</p>`;
  S.cache.registros = data;
  const totMin = data.reduce((s, x) => s + (x.salida ? (new Date(x.salida) - new Date(x.entrada)) / 60000 : 0), 0);
  $("regRes").innerHTML = `
    <p class="text-sm text-slate-400 mb-3">${data.length} fichaje(s) · ${fMin(totMin)} trabajadas (jornadas cerradas) · ${data.filter(x => x.tardanza_min > 0).length} tardanza(s) · ${data.filter(x => x.salida_anticipada_min > 0).length} salida(s) anticipada(s)${data.length === 2000 ? " · <span class='text-amber-300'>se muestran los primeros 2000, acotá las fechas</span>" : ""}</p>
    <div class="card overflow-x-auto"><table class="tbl"><thead><tr><th>Fecha</th><th>Colaborador</th><th>DNI</th><th>Horario</th><th>Oficina</th><th>Entrada</th><th>Salida</th><th>Tiempo</th><th>Estado</th><th></th></tr></thead><tbody>
      ${data.length ? data.map(x => `<tr><td>${fFecha(x.entrada)}</td><td class="font-medium">${esc(x.colaboradores?.nombre)}</td><td class="font-mono text-xs">${esc(x.colaboradores?.dni)}</td>
        <td class="whitespace-nowrap">${x.hora_entrada_prog ? fHorario({ hora_entrada: x.hora_entrada_prog, hora_salida: x.hora_salida_prog }) : "—"}</td>
        <td>${esc(x.oficina?.nombre || "—")}${x.oficina_salida && x.oficina_salida.nombre !== x.oficina?.nombre ? `<p class="text-xs text-slate-400">Salida: ${esc(x.oficina_salida.nombre)}</p>` : ""}</td>
        <td class="whitespace-nowrap">${fHora(x.entrada)}${iconoLugar(x.entrada_lugar, x.entrada_distancia_m)}</td><td class="whitespace-nowrap">${x.salida ? (fFecha(x.salida) !== fFecha(x.entrada) ? fFecha(x.salida) + " " : "") + fHora(x.salida) + iconoLugar(x.salida_lugar, x.salida_distancia_m) : "—"}</td>
        <td>${x.salida ? fMin((new Date(x.salida) - new Date(x.entrada)) / 60000) : "—"}</td><td>${estadoBadge(x)}</td>
        <td><button class="btn btn-sm btn-sec" title="Corregir" onclick="abrirCorreccion(${x.id})"><i class="fa-solid fa-pen"></i></button></td></tr>`).join("")
      : `<tr><td colspan="10" class="text-center text-slate-400 py-6">Sin fichajes en ese período.</td></tr>`}
    </tbody></table></div>
    ${rech?.length ? `<div class="card overflow-x-auto mt-6">
      <div class="px-4 py-3 border-b border-slate-700 font-semibold text-sm"><i class="fa-solid fa-shield-halved text-red-400 mr-1"></i>Intentos rechazados (${rech.length})</div>
      <table class="tbl"><thead><tr><th>Fecha</th><th>Hora</th><th>Colaborador</th><th>Oficina</th><th>Tipo</th><th>Motivo</th></tr></thead><tbody>
      ${rech.map(x => `<tr><td>${fFecha(x.creado)}</td><td>${fHora(x.creado)}</td><td class="font-medium">${esc(x.colaboradores?.nombre || "—")}</td><td>${esc(x.oficinas?.nombre || "—")}</td>
        <td>${x.tipo === "entrada" ? "Entrada" : "Salida"}</td><td class="text-xs text-slate-300">${esc(x.motivo)}</td></tr>`).join("")}
      </tbody></table></div>` : ""}`;
}
function iconoLugar(lugar, dist) {
  if (!lugar) return "";
  const t = (lugar === "remoto" ? "Desde el lugar remoto" : "En la oficina") + (dist != null ? ` · a ${dist} m` : "");
  return ` <span title="${t}" class="text-xs">${lugar === "remoto" ? "🏠" : "🏢"}</span>`;
}
const aLocalInput = ts => ts ? new Date(new Date(ts).getTime() - 3 * 3600e3).toISOString().slice(0, 16) : "";
function abrirCorreccion(id) {
  const x = S.cache.registros.find(r => r.id === id);
  abrirModal(`
    <h3 class="text-lg font-bold mb-1">Corregir fichaje</h3>
    <p class="text-sm text-slate-400 mb-4">${esc(x.colaboradores?.nombre)} · ${fFecha(x.entrada)}</p>
    <div class="space-y-3">
      <div><label class="lbl">Entrada</label><input type="datetime-local" id="coEnt" class="inp" value="${aLocalInput(x.entrada)}"></div>
      <div><label class="lbl">Salida</label><input type="datetime-local" id="coSal" class="inp" value="${aLocalInput(x.salida)}"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl">Tardanza (min)</label><input type="number" min="0" id="coTar" class="inp" value="${x.tardanza_min}"></div>
        <div><label class="lbl">Salida anticipada (min)</label><input type="number" min="0" id="coAnt" class="inp" value="${x.salida_anticipada_min || 0}"></div>
      </div>
      <p class="text-xs text-slate-400">Horario de Argentina (UTC-3). Dejá la salida vacía si la jornada sigue abierta.</p>
      <div class="flex justify-end gap-2"><button class="btn btn-sec" onclick="cerrarModal()">Cancelar</button><button class="btn btn-pri" onclick="guardarCorreccion(${id})">Guardar</button></div>
    </div>`);
}
async function guardarCorreccion(id) {
  const ent = $("coEnt").value, sal = $("coSal").value;
  if (!ent) return toast("Falta la entrada", "error");
  if (sal && sal < ent) return toast("La salida no puede ser anterior a la entrada", "error");
  const { error } = await sb.from("registros").update({ entrada: ent + ":00-03:00", salida: sal ? sal + ":00-03:00" : null, tardanza_min: Math.max(0, +$("coTar").value || 0), salida_anticipada_min: Math.max(0, +$("coAnt").value || 0) }).eq("id", id);
  if (error) return toast(errTxt(error), "error");
  cerrarModal(); toast("Fichaje corregido"); buscarRegistros();
}
function exportarRegistros() {
  const d = S.cache.registros || [];
  if (!d.length) return toast("No hay registros para exportar", "error");
  const lug = l => l === "remoto" ? "Remoto" : l === "oficina" ? "Oficina" : "";
  const filas = [["Fecha", "Colaborador", "DNI", "Horario", "Día laborable", "Oficina", "Entrada", "Lugar entrada", "Salida", "Lugar salida", "Minutos trabajados", "Tardanza (min)", "Salida anticipada (min)"]].concat(
    d.slice().reverse().map(x => [fFecha(x.entrada), x.colaboradores?.nombre, x.colaboradores?.dni,
      x.hora_entrada_prog ? `${hm(x.hora_entrada_prog)}-${hm(x.hora_salida_prog)}` : "", x.dia_laborable === false ? "No" : "Sí",
      x.oficina?.nombre || "", fHora(x.entrada), lug(x.entrada_lugar), x.salida ? fHora(x.salida) : "", lug(x.salida_lugar),
      x.salida ? Math.round((new Date(x.salida) - new Date(x.entrada)) / 60000) : "", x.tardanza_min, x.salida_anticipada_min || 0]));
  const csv = "﻿" + filas.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `fichajes_${S.empresa.nombre.replace(/\W+/g, "_")}_${S.filtroReg.desde}_${S.filtroReg.hasta}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

// ---- Tolerancia ----
function tabAjustes() {
  const e = S.empresa;
  $("empMain").innerHTML = `
    <div class="card p-6 max-w-lg">
      <h3 class="text-lg font-bold mb-1">Configuración</h3>
      <p class="font-semibold text-sm mt-4 mb-1">Tolerancia</p>
      <p class="text-sm text-slate-400 mb-4">Minutos de margen para todos los colaboradores. Llegar dentro de este margen no cuenta como tardanza, e irse dentro de este margen antes de la hora de salida no cuenta como salida anticipada.</p>
      <div class="max-w-[12rem]"><label class="lbl">Tolerancia (minutos)</label><input type="number" id="ajTol" min="0" max="240" class="inp" value="${e.tolerancia_min}"></div>
      <p class="text-xs text-slate-400 mt-3">Los horarios de entrada, salida y días de trabajo se cargan en cada colaborador, desde <b>Colaboradores</b>.</p>
      <p class="font-semibold text-sm mt-6 mb-1">Celular vinculado</p>
      <label class="flex items-start gap-2 text-sm cursor-pointer"><input type="checkbox" id="ajVinc" class="w-4 h-4 mt-0.5" ${e.vincular_dispositivo !== false ? "checked" : ""}>
        <span>Cada colaborador ficha solo desde su propio celular. El primer fichaje vincula el celular al DNI; si cambia de teléfono, lo desvinculás desde <b>Colaboradores</b>. Apagalo solo si usan un celular o tablet compartido para fichar.</span></label>
      <button class="btn btn-pri mt-5" onclick="guardarTolerancia()">Guardar</button>
    </div>`;
}
async function guardarTolerancia() {
  const t = +$("ajTol").value;
  if (!Number.isInteger(t) || t < 0 || t > 240) return toast("La tolerancia tiene que ser entre 0 y 240 minutos", "error");
  try {
    const v = $("ajVinc").checked;
    await rpc("rl_guardar_config", { p_empresa: S.empresaId, p_tolerancia: t, p_vincular: v });
    S.empresa.tolerancia_min = t; S.empresa.vincular_dispositivo = v; toast("Configuración guardada");
  } catch (e) { toast(errTxt(e), "error"); }
}

// ================== FICHAJE POR QR (empleado, sin login) ==================
async function renderFichaje() {
  $("app").innerHTML = cargando("Verificando código…");
  let info = null;
  try { info = await rpc("rl_fichaje_info", { p_token: qrParam }); } catch {}
  S.infoFichaje = info;
  if (!info) {
    $("app").innerHTML = `<div class="flex-grow flex items-center justify-center p-6 text-center"><div class="card p-8 max-w-sm">
      <div class="text-4xl mb-3">⚠️</div><h2 class="text-lg font-bold">Código QR no válido</h2>
      <p class="text-sm text-slate-400 mt-2">Este código está desactivado o fue reemplazado. Avisale a tu encargado.</p></div></div>`;
    return;
  }
  $("app").innerHTML = `
  <div class="flex-grow flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6">
        <p class="text-xs uppercase tracking-wider text-indigo-300 font-semibold">${esc(info.empresa)}</p>
        <h1 class="text-xl font-bold">${esc(info.oficina)}</h1>
        ${info.direccion ? `<p class="text-xs text-slate-400">${esc(info.direccion)}</p>` : ""}
        <p id="reloj" class="text-5xl font-bold tabular-nums mt-4">--:--</p>
        <p id="relojFecha" class="text-sm text-slate-400"></p>
      </div>
      <div id="fichajeCuerpo" class="card p-6">
        <label class="lbl" for="dniInput">Tu DNI</label>
        <input id="dniInput" class="inp text-center text-2xl font-mono tracking-widest" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="12345678"
          oninput="this.value=this.value.replace(/\\D/g,'')" onkeydown="if(event.key==='Enter')fichar('entrada')">
        <p id="fichEstado" class="text-indigo-300 text-sm text-center mt-2 hidden"></p>
        <p id="fichErr" class="text-red-400 text-sm text-center min-h-[1.25rem] mt-2"></p>
        <div class="grid grid-cols-2 gap-3 mt-2">
          <button id="btnEnt" onclick="fichar('entrada')" class="btn py-4 text-base bg-emerald-600 hover:bg-emerald-500 text-white"><i class="fa-solid fa-right-to-bracket"></i>Entrada</button>
          <button id="btnSal" onclick="fichar('salida')" class="btn py-4 text-base bg-rose-600 hover:bg-rose-500 text-white"><i class="fa-solid fa-right-from-bracket"></i>Salida</button>
        </div>
      </div>
      ${info.geo ? `<p class="text-center text-xs text-slate-400 mt-4">📍 Para fichar tenés que estar en el lugar: te vamos a pedir la ubicación del celular.</p>` : ""}
      <p class="text-center text-xs text-slate-500 mt-2">RelojLaboral Pro</p>
    </div>
  </div>`;
  const tick = () => {
    const d = new Date();
    if (!$("reloj")) return;
    $("reloj").textContent = d.toLocaleTimeString("es-AR", { timeZone: ZONA, hour: "2-digit", minute: "2-digit", hour12: false });
    $("relojFecha").textContent = d.toLocaleDateString("es-AR", { timeZone: ZONA, weekday: "long", day: "numeric", month: "long" });
  };
  tick(); clearInterval(S._reloj); S._reloj = setInterval(tick, 1000);
  $("dniInput").focus();
}
// Identificador de este celular (se crea una vez y queda guardado en el navegador)
function idDispositivo() {
  try {
    let t = localStorage.getItem("rl_dispositivo");
    if (!t || t.length < 16) {
      const a = new Uint8Array(24); crypto.getRandomValues(a);
      t = [...a].map(b => b.toString(16).padStart(2, "0")).join("");
      localStorage.setItem("rl_dispositivo", t);
    }
    return t;
  } catch { return null; }
}
function obtenerUbicacion() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ error: "Este celular no permite obtener la ubicación." });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy }),
      e => res({ error: e.code === 1
        ? "Necesitamos tu ubicación para fichar. Permití el acceso a la ubicación (en el navegador, tocá el candado o el ícono de ajustes junto a la dirección) y probá de nuevo."
        : e.code === 3 ? "No se pudo obtener la ubicación a tiempo. Activá el GPS y probá de nuevo." : "No se pudo obtener la ubicación. Activá el GPS y probá de nuevo." }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 20000 });
  });
}
function estadoFichaje(t) { const e = $("fichEstado"); if (!e) return; e.textContent = t || ""; e.classList.toggle("hidden", !t); }
async function fichar(tipo) {
  const dni = $("dniInput").value.replace(/\D/g, "");
  $("fichErr").textContent = "";
  if (dni.length < 6) { $("fichErr").textContent = "Ingresá tu DNI completo."; return; }
  $("btnEnt").disabled = $("btnSal").disabled = true;
  const reactivar = msg => { estadoFichaje(""); $("fichErr").textContent = msg; $("btnEnt").disabled = $("btnSal").disabled = false; };
  let pos = { lat: null, lng: null, precision: null };
  if (S.infoFichaje?.geo) {
    estadoFichaje("📍 Obteniendo tu ubicación…");
    pos = await obtenerUbicacion();
    if (pos.error) return reactivar(pos.error);
  }
  estadoFichaje("Registrando…");
  let r;
  try { r = await rpc("rl_fichar", { p_token: qrParam, p_dni: dni, p_tipo: tipo, p_lat: pos.lat, p_lng: pos.lng, p_precision: pos.precision, p_dispositivo: idDispositivo() }); }
  catch { r = { ok: false, error: "Sin conexión. Probá de nuevo." }; }
  if (!r.ok) return reactivar(r.error);
  estadoFichaje("");
  const ent = r.tipo === "entrada";
  $("fichajeCuerpo").innerHTML = `
    <div class="text-center py-2">
      <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center text-3xl ${ent ? "bg-emerald-500/20 text-emerald-300" : "bg-rose-500/20 text-rose-300"}"><i class="fa-solid fa-check"></i></div>
      <p class="text-sm text-slate-400 mt-3">${ent ? "Entrada registrada" : "Salida registrada"}</p>
      <h2 class="text-xl font-bold">${esc(r.nombre)}</h2>
      <p class="text-4xl font-bold tabular-nums my-2">${esc(r.hora)}</p>
      ${ent && r.tardanza_min > 0 ? `<p class="badge bg-amber-500/15 text-amber-300">Llegada tarde: ${fMinCorto(r.tardanza_min)}</p>` : ""}
      ${ent && r.dia_laborable === false ? `<p class="badge bg-sky-500/15 text-sky-300">Hoy no es tu día de trabajo</p>` : ""}
      ${ent && r.dia_laborable !== false && r.hora_salida_prog ? `<p class="text-sm text-slate-300 mt-1">Tu horario de salida: ${esc(r.hora_salida_prog)}</p>` : ""}
      ${!ent ? `<p class="text-sm text-slate-300">Jornada: ${fMin(r.minutos)}</p>` : ""}
      ${!ent && r.salida_anticipada_min > 0 ? `<p class="badge bg-orange-500/15 text-orange-300 mt-1">Salida anticipada: ${fMinCorto(r.salida_anticipada_min)}</p>` : ""}
      ${r.lugar ? `<p class="text-xs text-slate-400 mt-2">${r.lugar === "remoto" ? "🏠 Desde tu lugar remoto" : "🏢 En la oficina"}${r.distancia_m != null ? ` · a ${r.distancia_m} m` : ""}</p>` : ""}
      ${r.vinculado_ahora ? `<p class="text-xs text-emerald-300 mt-2">📱 Este celular quedó vinculado a tu DNI. Usá siempre este celular para fichar.</p>` : ""}
      <button class="btn btn-sec mt-5 w-full" onclick="renderFichaje()">Listo</button>
    </div>`;
  setTimeout(() => { if (document.body.contains($("fichajeCuerpo")) && !$("dniInput")) renderFichaje(); }, 8000);
}

// Sesión vencida o cerrada en otra pestaña
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && S.user && !qrParam) { S.user = null; renderLogin("Tu sesión terminó. Volvé a entrar."); } });

init();
</script>
